<style>
/* Layout: vaste navigatie links (boven op telefoon), werkblad rechts; spaarbankboekje-groen als inkt. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e9efed; --ink:#13211f; --muted:#5a6a67; --line:#dbe3e0;
  --accent:#0c6a5e; --accent-ink:#ffffff; --accent-soft:#dcede8;
  --pos:#1d7a3e; --neg:#b3352c; --neg-soft:#f6dedb; --warn:#9a5d00; --warn-soft:#f6ead2;
  --bar-out:#c8b28a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#141e1c; --sunk:#1a2624; --ink:#e4edeb; --muted:#93a4a0; --line:#263431;
  --accent:#4cbfab; --accent-ink:#06201b; --accent-soft:#163029;
  --pos:#62c987; --neg:#ef7c71; --neg-soft:#3a1d1a; --warn:#e3a84c; --warn-soft:#352812;
  --bar-out:#8a7a5c; color-scheme:dark;}}
:root[data-theme="dark"]{

  --accent:#4cbfab; --accent-ink:#06201b; --accent-soft:#163029;
  --pos:#62c987; --neg:#ef7c71; --neg-soft:#3a1d1a; --warn:#e3a84c; --warn-soft:#352812;
  --bar-out:#8a7a5c; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.55rem}
h3{font-size:1.05rem;font-weight:500}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%;}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.25rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .count{font-family:var(--f-data);font-size:.75rem;padding:0 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.period{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.err{background:var(--neg-soft);color:var(--neg)}
.status.demo{background:var(--warn-soft);color:var(--warn)}

select,input[type=text],input[type=date],input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:3px 9px;font-size:.85rem}
.btn.danger{color:var(--neg)}
.btn.icon{padding:3px 8px;border-color:transparent;background:transparent;color:var(--muted)}
.btn.icon:hover{color:var(--neg)}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink)}
.banner p{margin:0;max-width:62ch}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi{gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.75rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:.82rem;color:var(--muted)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-data)}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 92px 96px;gap:12px;align-items:center;font-size:.9rem}
.track{height:9px;border-radius:99px;background:var(--sunk);position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.fill.over{background:var(--neg)}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .d{font-family:var(--f-data);font-size:.8rem;color:var(--muted);min-width:56px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-top:2px solid var(--line);background:var(--sunk)}
td input[type=text],td select{width:100%}
td .amt{width:110px;text-align:right;font-family:var(--f-data)}
.txdesc{display:flex;flex-direction:column;min-width:180px}
.txdesc small{color:var(--muted)}
.todo td{background:color-mix(in srgb,var(--warn-soft) 55%,transparent)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 200px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav b{min-width:120px;text-align:center;font-family:var(--f-display);font-weight:500}

.panel{border:1px dashed var(--accent);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.maprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.maprow label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}

.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:.92rem}
.calc .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.fields input{text-align:right;font-family:var(--f-data)}

.goal{gap:10px}
.goal .gh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.goal .gh input{font-family:var(--f-display);font-weight:500;font-size:1.05rem;border-color:transparent;background:transparent;padding:2px 4px;margin-left:-4px;width:100%}
.goal .gh input:hover{border-color:var(--line)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:0;max-width:75ch}
.hide-sm{}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);background:var(--bg);gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .brand b{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav a{white-space:nowrap;gap:6px}
  .side .foot{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:1.35rem}.barrow{grid-template-columns:minmax(0,1fr) auto}.barrow{grid-template-columns:minmax(0,1fr) auto auto}.barrow .track{grid-column:1/-1;grid-row:2}.hide-sm{display:none}}
@media (prefers-reduced-motion:no-preference){.fill,.progress i{transition:width .3s ease}}
</style>

let DB=null, ROOT=null, DL=null; const dirty=new Set(); let saveTimer=null, flushing=false;
const LS="huisboekje-v1";
function setStatus(text,kind=""){S.status=text;S.statusKind=kind;const el=$("#status");if(el){el.textContent=text;el.className="status "+kind}}
function baseStatus(){ if(S.demo) return setStatus("Voorbeeld · niet opgeslagen","demo");
  if(S.backend==="local"&&S.apiNote) return setStatus("Server niet ingesteld: alleen in deze browser","err");
  setStatus(S.backend==="db"?"Opgeslagen in je account (privé)":S.backend==="api"?"Opgeslagen op je eigen server":"Opgeslagen in deze browser","ok"); }
function save(key){ if(S.demo) return; dirty.add(key); clearTimeout(saveTimer); setStatus("Opslaan…"); saveTimer=setTimeout(flush,700); }
async function flush(){
  if(flushing){saveTimer=setTimeout(flush,400);return}
  flushing=true; const keys=[...dirty]; dirty.clear();
  try{
    if(S.backend==="api"){
      const r=await fetch("/api/data",{method:"PUT",credentials:"same-origin",redirect:"manual",headers:{"content-type":"application/json","if-match":String(S.ver||0)},body:JSON.stringify({state:{data:S.data,months:S.months}})});
      if(r.type==="opaqueredirect"||r.status===401||r.status===403) throw {code:"auth",message:"je sessie is verlopen. Herlaad de pagina en log opnieuw in."};
      if(r.status===409) throw {code:"conflict",message:"op een ander apparaat gewijzigd. Herlaad de pagina."};
      const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw {code:"api",message:j.error||("serverfout "+r.status)};
      S.ver=j.version; try{ localStorage.setItem(LS,JSON.stringify({data:S.data,months:S.months})); }catch(_){}
    } else if(S.backend==="db"){
      for(const k of keys){
        if(k==="root") await ROOT.set(JSON.parse(JSON.stringify(S.data)));
        else { const items=S.months[k]||[]; const ref=ROOT.collection("maanden").doc("m"+k);
          if(items.length) await ref.set({items:JSON.parse(JSON.stringify(items))}); else await ref.delete(); }
      }
    } else {
      try{ localStorage.setItem(LS,JSON.stringify({data:S.data,months:S.months})); }catch(e){ throw {code:"local",message:"Browseropslag is vol of geblokkeerd."}; }
    }
    baseStatus();
  }catch(e){
    keys.forEach(k=>dirty.add(k));
    if(e&&e.code==="unavailable"){ setStatus("Opnieuw proberen…"); saveTimer=setTimeout(flush,1500+Math.random()*1500); }
    else setStatus(e&&e.code==="quota_exceeded"?"Opslag vol: verwijder oude gegevens":"Niet opgeslagen: "+(e&&e.message||"onbekende fout"),"err");
  } finally { flushing=false; }
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout",message:"Geen antwoord"}),ms))])}
function migrate(d){ const e=emptyData(); for(const k of Object.keys(e)) if(d[k]==null) d[k]=e[k]; d.box3={...BOX3_DEFAULT,...d.box3}; return d; }

async function boot(){
  const demo=demoData(); S.data=demo.data; S.months=demo.months; S.demo=true; render();
  let dbNs=null,userNs=null,id=null;
  try{ if(window.claude&&window.claude.use){ [dbNs,userNs,DL]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]); } }catch(e){}
  try{ id=userNs?await userNs.id():null }catch(e){}
  if(dbNs&&id){
    try{
      DB=dbNs; ROOT=DB.doc(`data/users/${id}/boekje`);
      const snap=await withTimeout(ROOT.get(),10000);
      S.backend="db";
      if(snap.exists){
        const ms=await withTimeout(ROOT.collection("maanden").get(),10000);
        S.data=migrate({...snap.data()}); S.months={};
        for(const d of ms.docs){ const v=d.data(); if(v&&Array.isArray(v.items)) S.months[d.id.slice(1)]=v.items.map(x=>({...x})); }
        S.demo=false;
      }
    }catch(e){ S.backend="local"; DB=null; ROOT=null; }
  } else S.backend="local";
  /* Eigen website (Cloudflare Pages): gegevens via /api/data, afgeschermd door Cloudflare Access. */
  if(S.backend!=="db"&&!(window.claude&&window.claude.use)){
    try{
      const r=await withTimeout(fetch("/api/data",{credentials:"same-origin",redirect:"manual",headers:{accept:"application/json"}}),10000);
      const isJson=(r.headers.get("content-type")||"").includes("json");
      if(r.ok&&isJson){ const j=await r.json(); if(j.ok){ S.backend="api"; S.ver=j.version||0;
          if(j.state&&j.state.data){ S.data=migrate(j.state.data); S.months=j.state.months||{}; S.demo=false; } } }
      else if(isJson&&r.status>=400) S.apiNote=true;
    }catch(e){}
  }
  if(S.backend==="local"){
    try{ const raw=localStorage.getItem(LS); if(raw){ const v=JSON.parse(raw); S.data=migrate(v.data); S.months=v.months||{}; S.demo=false; } }catch(e){}
  }
  baseStatus(); rerender();
}

function txOf(y,m){ if(m!=null&&m>=0) return S.months[ymKey(y,m)]||[]; let out=[]; for(let i=0;i<12;i++) out=out.concat(S.months[ymKey(y,i)]||[]); return out; }
function sums(list){ const r={inc:0,exp:0,save:0,byCat:{},todo:0};
  for(const t of list){ const ty=CT[t.cat]||"auto";
    if(ty==="in") r.inc+=t.amount; else if(ty==="skip"){} else if(ty==="save") r.save-=t.amount;
    else if(ty==="auto"){ r.todo++; if(t.amount>0) r.inc+=t.amount; else { r.exp-=t.amount; r.byCat[t.cat]=(r.byCat[t.cat]||0)-t.amount; } }
    else { r.exp-=t.amount; r.byCat[t.cat]=(r.byCat[t.cat]||0)-t.amount; } }
  return r; }
const perMonth=b=>(b.amount||0)/(FREQ[b.freq]||1);
function budgetBy(){ const r={inc:0,exp:0,save:0,byCat:{}}; for(const b of S.data.budget){ const v=perMonth(b), ty=CT[b.cat];
  if(ty==="in") r.inc+=v; else if(ty==="save") r.save+=v; else if(ty==="out"){ r.exp+=v; r.byCat[b.cat]=(r.byCat[b.cat]||0)+v; } } return r; }
function monthsInPeriod(){ if(S.month>=0) return 1; if(S.year<TY) return 12; if(S.year>TY) return 0; return TM+1; }
function acctTotals(y){ let bank=0,overig=0,schuld=0,bez=0,sch=0;
  for(const a of S.data.accounts){ const v=+(a.values?.[y])||0;
    if(a.soort==="bank") bank+=v; if(a.soort==="overig") overig+=v; if(a.soort==="schuld") schuld+=v;
    if(NEGSOORT.has(a.soort)) sch+=v; else bez+=v; }
  return {bank,overig,schuld,bez,sch,net:bez-sch}; }
function box3(p,bank,overig,schuld){
  const drempel=p.drempel*(p.partner?2:1), hvv=p.hvv*(p.partner?2:1);
  const sAft=Math.max(0,schuld-drempel);
  const rg=bank+overig-sAft;
  const voordeel=bank*p.bank/100+overig*p.overig/100-sAft*p.schuld/100;
  const grondslag=Math.max(0,rg-hvv);
  const eff=rg>0?voordeel/rg:0;
  const belastbaar=Math.max(0,grondslag*eff);
  return {drempel,hvv,sAft,rg,voordeel,grondslag,eff,belastbaar,belasting:belastbaar*p.tarief/100};
}
function nextDeadlines(n){ const out=[]; for(const [id,m,d,txt,tag] of KALENDER){ const dt=new Date(TY,m-1,d); const done=S.data.kalender?.[TY]?.[id];
  if(!done) out.push({id,dt,txt,tag,late:dt<new Date(TY,TM,today.getDate())}); }
  return out.sort((a,b)=>a.dt-b.dt).slice(0,n); }
function autoCat(party,desc){ const p=norm(party), d=norm(desc), r=S.data.rules||{};
  if(p&&r[p]) return r[p]; for(const k in r) if(k.length>2&&(d.includes(k)||p.includes(k))) return r[k];
  const hay=p+" "+d; for(const [re,c] of KEYWORDS) if(re.test(hay)) return c; return "Nog indelen|"; }

function vOverzicht(){
  const list=txOf(S.year,S.month), s=sums(list), B=budgetBy(), nm=monthsInPeriod();
  const netto=s.inc-s.exp-s.save, quote=s.inc>0?(s.save+Math.max(0,netto))/s.inc:NaN;
  const acc=acctTotals(S.year), accPrev=acctTotals(S.year-1);
  const buffer=B.exp>0?acc.bank/B.exp:NaN;
  // grafiek
  const data=[...Array(12)].map((_,i)=>sums(txOf(S.year,i)));
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp+d.save)));
  const step=niceStep(max/4), top=Math.ceil(max/step)*step;
  const W=760,H=230,pl=56,pr=8,pt=10,pb=26, gw=(W-pl-pr)/12, bw=gw*.32, y=v=>pt+(H-pt-pb)*(1-v/top);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Inkomsten en uitgaven per maand in ${S.year}">`;
  for(let v=0;v<=top+1e-6;v+=step){ svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("nl-NL")+"k":v}</text>`; }
  data.forEach((d,i)=>{ const x=pl+i*gw, sel=i===S.month;
    svg+=`<g data-act="pick-month" data-m="${i}" style="cursor:pointer">${sel?`<rect x="${x+2}" y="${pt}" width="${gw-4}" height="${H-pt-pb}" rx="6" fill="var(--accent-soft)"/>`:""}<rect x="${x}" y="${pt}" width="${gw}" height="${H-pt}" fill="transparent"/>`;
    if(d.inc) svg+=`<rect x="${x+gw/2-bw-1}" y="${y(d.inc)}" width="${bw}" height="${y(0)-y(d.inc)}" rx="2" fill="var(--accent)"><title>${MONTHS_L[i]}: inkomsten ${eur(d.inc)}</title></rect>`;

/* ---------- Import ---------- */
function detectDelim(line){ const c={";":0,",":0,"\t":0}; let q=false; for(const ch of line){ if(ch==='"')q=!q; else if(!q&&ch in c)c[ch]++; } return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; }
function parseCSV(text,d){ const rows=[]; let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===d){row.push(f);f=""} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(f);f=""; if(row.some(x=>x.trim()))rows.push(row); row=[]; } else f+=ch; }
  row.push(f); if(row.some(x=>x.trim()))rows.push(row); return rows; }
async function readImport(file){ if(!file) return;
  try{ const buf=await file.arrayBuffer(); let text=new TextDecoder("utf-8").decode(buf); if(text.includes("\uFFFD")) text=new TextDecoder("windows-1252").decode(buf);
    text=text.replace(/^﻿/,"");
    const first=text.split(/\r?\n/).find(l=>l.trim())||""; const d=detectDelim(first); const rows=parseCSV(text,d);
    if(rows.length<1) throw new Error("Het bestand is leeg.");
    let header=rows[0].map(h=>h.trim()); let body=rows.slice(1);
    const hasHeader=header.some(h=>/[a-z]{3,}/i.test(h)&&!parseDate(h)&&!/^-?[\d.,]+$/.test(h));
    if(!hasHeader){ body=rows; header=rows[0].map((_,i)=>"kolom "+(i+1)); }
    S.imp={name:file.name,header,rows:body,map:guessMap(header,body)}; rerender();
  }catch(e){ S.imp={err:"Kon het bestand niet lezen: "+(e.message||e)}; rerender(); } }
function guessMap(h,body){ const H=h.map(norm); const find=(...res)=>{ for(const re of res){ const i=H.findIndex(x=>re.test(x)); if(i>=0) return i; } return -1; };
  const m={date:find(/^datum$/,/boekdatum|transactiedatum|^date$|datum/),amount:find(/^bedrag/,/amount|transactiebedrag|bedrag/),sign:find(/af ?\/? ?bij|debet\/credit|^af bij$|credit|debit/),
    party:find(/naam tegenpartij|tegenpartij naam|^naam|naam \/ omschrijving|counterparty|name|tegenpartij|begunstigde/),desc:find(/omschrijving-?1|^omschrijving$|mededelingen|omschrijving|description|memo/)};
  if(m.desc===m.party) m.desc=find(/mededelingen|omschrijving-?1|description/);
  if(m.date<0&&body[0]){ m.date=body[0].findIndex(v=>parseDate(v)); }
  if(m.amount<0&&body[0]){ m.amount=body[0].findIndex((v,i)=>i!==m.date&&/^-?[\d.]+,\d{2}$|^-?\d+\.\d{2}$/.test(v.trim())); }
  return m; }
function importParse(){ const I=S.imp, m=I.map; const existing=new Set();
  for(const k in S.months) for(const t of S.months[k]) existing.add(t.date+"|"+t.amount.toFixed(2)+"|"+norm(t.party||t.desc).slice(0,24));
  const seen=new Set();
  return I.rows.map(r=>{ const g=i=>i>=0?(r[i]||"").trim():"";
    let amount=parseAmt(g(m.amount)); const sign=norm(g(m.sign)); if(m.sign>=0&&/^(af|d|debet|debit)/.test(sign)) amount=-Math.abs(amount); else if(m.sign>=0&&/^(bij|c|credit)/.test(sign)) amount=Math.abs(amount);
    const date=parseDate(g(m.date)), party=g(m.party).replace(/\s+/g," "), desc=g(m.desc).replace(/\s+/g," ");
    const key=date+"|"+amount.toFixed(2)+"|"+norm(party||desc).slice(0,24);
    const dup=existing.has(key)||seen.has(key); seen.add(key);
    return {date,amount,party,desc,dup,cs:autoCat(party,desc)}; }); }
function doImport(){ const rows=importParse().filter(r=>!r.dup&&r.date); const touched=new Set();
  for(const r of rows){ const [cat,sub]=r.cs.split("|"); const k=r.date.slice(0,7); (S.months[k]=S.months[k]||[]).push({id:uid(),date:r.date,desc:r.desc,party:r.party,amount:Math.round(r.amount*100)/100,cat,sub,fiscaal:FISCAL_SUBS.has(sub)}); touched.add(k); }
  for(const k of touched){ S.months[k].sort((a,b)=>a.date.localeCompare(b.date)); save(k); }
  const last=[...touched].sort().pop(); if(last){ S.year=+last.slice(0,4); S.month=+last.slice(5)-1; }
  S.imp=null; toast(`${rows.length} transacties geïmporteerd${S.demo?" (voorbeeldmodus: niet opgeslagen)":""}.`); rerender(); }

async function download(filename,data){
  if(!(window.claude&&window.claude.use)){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/csv"})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); return; }
  if(DL){ try{ await DL.save({filename,data}); toast("Bestand klaargezet om op te slaan."); return; }catch(e){ if(e&&e.code==="declined") return; } }
  toast("Downloaden kan in deze weergave niet. Open het huisboekje via claude.ai."); }
function csvCell(v){ v=String(v??""); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

function findTx(ym,id){ const L=S.months[ym]||[]; return [L,L.findIndex(t=>t.id===id)]; }
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(a!=="wipe"&&a!=="import-json") S.confirm=null;
  switch(a){
    case "start": startOwn(false); break;
    case "start-budget": startOwn(true); break;
    case "pick-month": S.month=+el.dataset.m===S.month?-1:+el.dataset.m; rerender(); break;
    case "todo-filter": S.todo=true; break;
    case "fisc-year": S.year=+el.dataset.y; S.month=-1; S.q=""; S.fcat=""; break;
    case "prev-month": if(S.month<0)S.month=TM; S.month--; if(S.month<0){S.month=11;S.year--} rerender(); break;
    case "next-month": if(S.month<0)S.month=TM-1; S.month++; if(S.month>11){S.month=0;S.year++} rerender(); break;
    case "whole-year": S.month=S.month>=0?-1:(S.year===TY?TM:0); rerender(); break;
    case "toggle-add": S.showAdd=!S.showAdd; rerender(); if(S.showAdd) $("#add-desc")?.focus(); break;
    case "toggle-import": S.imp=S.imp?null:{}; rerender(); break;
    case "do-import": doImport(); break;
    case "add-tx": { const date=$("#add-date").value, amt=parseAmt($("#add-amt").value); if(!date||!amt){ toast("Vul een datum en een bedrag in."); return; }
      let cs=$("#add-cat").value; const party=$("#add-party").value.trim(), desc=$("#add-desc").value.trim(); if(cs==="Nog indelen|") cs=autoCat(party,desc);
      const [cat,sub]=cs.split("|"), k=date.slice(0,7); (S.months[k]=S.months[k]||[]).push({id:uid(),date,desc,party,amount:amt,cat,sub,fiscaal:FISCAL_SUBS.has(sub)});
      S.months[k].sort((x,y)=>x.date.localeCompare(y.date)); save(k); $("#add-amt").value=""; toast("Toegevoegd."); rerender(); break; }
    case "del-tx": { const [L,i]=findTx(el.dataset.ym,id); if(i>=0){ L.splice(i,1); save(el.dataset.ym); rerender(); } break; }
    case "add-bud": S.data.budget.push({id:uid(),cat:"Huishouden",sub:"",freq:"maand",amount:0}); save("root"); rerender(); break;
    case "del-bud": S.data.budget=S.data.budget.filter(b=>b.id!==id); save("root"); rerender(); break;
    case "bud-from-tx": { const nm=Math.max(1,monthsInPeriod()||12); const have=new Set(S.data.budget.map(b=>b.cat+"|"+b.sub)); const agg={};
      for(const t of txOf(S.year,null)){ const ty=CT[t.cat]; if(ty==="skip"||ty==="auto") continue; const k=t.cat+"|"+(t.sub||""); agg[k]=(agg[k]||0)+(ty==="in"?t.amount:-t.amount); }
      let n=0; for(const [k,v] of Object.entries(agg)){ if(have.has(k)||v<=0) continue; const [cat,sub]=k.split("|"); S.data.budget.push({id:uid(),cat,sub,freq:"maand",amount:Math.round(v/nm)}); n++; }
      save("root"); toast(n?`${n} posten toegevoegd op basis van je uitgaven.`:"Alle posten met uitgaven staan al in je begroting."); rerender(); break; }
    case "add-acc": S.data.accounts.push({id:uid(),naam:"Nieuwe rekening",soort:"bank",values:{}}); save("root"); rerender(); break;
    case "del-acc": S.data.accounts=S.data.accounts.filter(x=>x.id!==id); save("root"); rerender(); break;
    case "add-goal": S.data.doelen.push({id:uid(),naam:"Nieuw doel",doel:0,gespaard:0,deadline:""}); save("root"); rerender(); break;
    case "del-goal": S.data.doelen=S.data.doelen.filter(x=>x.id!==id); save("root"); rerender(); break;
    case "b3-acc": if(S.data.box3in) delete S.data.box3in[S.taxYear]; save("root"); rerender(); break;
    case "export-json": download(`huisboekje-backup-${today.toISOString().slice(0,10)}.json`,JSON.stringify({app:"huisboekje",v:1,data:S.data,months:S.months},null,1)); break;
    case "export-csv": { const rows=[["datum","omschrijving","tegenpartij","bedrag","categorie","subcategorie","fiscaal_relevant"].join(";")];
      Object.keys(S.months).sort().forEach(k=>S.months[k].forEach(t=>rows.push([t.date,t.desc,t.party,String(t.amount).replace(".",","),t.cat,t.sub,t.fiscaal?"ja":"nee"].map(csvCell).join(";"))));
      download(`huisboekje-transacties.csv`,rows.join("\n")); break; }
    case "import-json": $("#file-backup").click(); break;
    case "wipe": if(S.confirm!=="wipe"){ S.confirm="wipe"; renderNav(); setTimeout(()=>{ if(S.confirm==="wipe"){S.confirm=null;renderNav()} },5000); break; }
      S.confirm=null; for(const k of Object.keys(S.months)){ S.months[k]=[]; save(k); } S.data=emptyData(); save("root"); toast("Alles gewist."); rerender(); break;
  }
});

  if(ch==="bud"){ const b=S.data.budget.find(x=>x.id===id); if(!b) return; b[k]=k==="amount"?Math.abs(parseAmt(el.value)):el.value; save("root"); return setTimeout(rerender,0); }
  if(ch==="acc"){ const x=S.data.accounts.find(a=>a.id===id); if(!x) return; if(k==="v"){ x.values=x.values||{}; x.values[el.dataset.y]=Math.abs(parseAmt(el.value)); } else x[k]=el.value; save("root"); return setTimeout(rerender,0); }
  if(ch==="goal"){ const g=S.data.doelen.find(x=>x.id===id); if(!g) return; g[k]=(k==="doel"||k==="gespaard")?Math.abs(parseAmt(el.value)):el.value; save("root"); return setTimeout(rerender,0); }
  if(ch==="ck"){ const y=S.taxYear; (S.data.checklist[y]=S.data.checklist[y]||{})[k]=el.checked; save("root"); return setTimeout(rerender,0); }
  if(ch==="kal"){ const y=S.year; (S.data.kalender[y]=S.data.kalender[y]||{})[k]=el.checked; save("root"); return setTimeout(rerender,0); }
  if(ch==="b3p"){ const p=S.data.box3; p[k]=k==="partner"?el.checked:k==="label"?el.value:parseAmt(el.value); save("root"); return setTimeout(rerender,0); }
  if(ch==="b3in"){ const ty=S.taxYear, peil=acctTotals(ty); S.data.box3in=S.data.box3in||{}; const cur=S.data.box3in[ty]||{bank:peil.bank,overig:peil.overig,schuld:peil.schuld};
    S.data.box3in[ty]={...cur,fromAcc:false,[k]:Math.abs(parseAmt(el.value))}; save("root"); return setTimeout(rerender,0); }
});
let qT; document.addEventListener("input",e=>{ if(e.target.id==="tx-q"){ S.q=e.target.value; clearTimeout(qT); qT=setTimeout(rerender,180); } });

function route(){ const h=(location.hash||"").slice(1); S.view=VIEWS.some(v=>v[0]===h)?h:"overzicht"; S.imp=null; S.showAdd=false; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange",route);
{ const h=(location.hash||"").slice(1); if(VIEWS.some(v=>v[0]===h)) S.view=h; }
boot();
</script>
